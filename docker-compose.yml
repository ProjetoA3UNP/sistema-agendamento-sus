services:
  mysql:
    image: mysql:8.0
    container_name: gestao_sus_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_sus_natal}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gestao_sus}
      MYSQL_USER: ${MYSQL_USER:-sus_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sus_pass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root_sus_natal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: gestao_sus_adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    name: gestao_sus_mysql_data
